name: Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for an official release, e.g. 1.0.0 (empty = prerelease build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (Liquid Glass needs the iOS 26 SDK)
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build without code signing
        run: |
          set -o pipefail
          xcodebuild build \
            -project MoonTime.xcodeproj \
            -target MoonTime \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning: .*(deprecated|unavailable)|BUILD" || true
          test -d build/Release-iphoneos/MoonTime.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/MoonTime.app Payload/
          zip -qry MoonTime-unsigned.ipa Payload
          ls -lh MoonTime-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MoonTime-unsigned-ipa
          path: MoonTime-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            TAG="v$VERSION"
            cp MoonTime-unsigned.ipa "MoonTime-$VERSION-unsigned.ipa"
            gh release create "$TAG" "MoonTime-$VERSION-unsigned.ipa" \
              --target "${{ github.sha }}" \
              --latest \
              --title "MoonTime $VERSION" \
              --notes-file RELEASE_NOTES.md
          else
            TAG="v0.1.0-unsigned.${{ github.run_number }}"
            gh release create "$TAG" MoonTime-unsigned.ipa \
              --target "${{ github.sha }}" \
              --prerelease \
              --title "MoonTime $TAG（未签名）" \
              --notes "未签名 IPA，需要用 AltStore、Sideloadly 或自己的证书重新签名后才能安装。构建自 ${{ github.sha }}。"
          fi
