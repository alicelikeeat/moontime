name: MoonTime
options:
  bundleIdPrefix: com.example.moontime
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  MoonTime:
    type: application
    platform: iOS
    sources: [MoonTime, Shared]
    info:
      path: MoonTime/Info.plist
      properties:
        CFBundleDisplayName: MoonTime
        CFBundleDevelopmentRegion: zh-Hans
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.moontime
    dependencies:
      - target: MoonTimeWidgets
  MoonTimeWidgets:
    type: app-extension
    platform: iOS
    sources: [MoonTimeWidgets, Shared]
    info:
      path: MoonTimeWidgets/Info.plist
      properties:
        CFBundleDisplayName: MoonTime
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.moontime.widgets
