name: MoonTime
options:
  bundleIdPrefix: com.example.moontime
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  MoonTime:
    type: application
    platform: iOS
    sources: [MoonTime, Shared]
    info:
      path: MoonTime/Info.plist
      properties:
        CFBundleDisplayName: MoonTime
        CFBundleDevelopmentRegion: zh-Hans
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSAlarmKitUsageDescription: MoonTime 会在你设定的时间响铃，即使手机静音也会提醒。
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.moontime
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MoonTimeWidgets
  MoonTimeWidgets:
    type: app-extension
    platform: iOS
    sources: [MoonTimeWidgets, Shared]
    info:
      path: MoonTimeWidgets/Info.plist
      properties:
        CFBundleDisplayName: MoonTime
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.moontime.widgets
  MoonTimeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MoonTimeUITests]
    dependencies:
      - target: MoonTime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.moontime.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MoonTime
schemes:
  MoonTime:
    build:
      targets:
        MoonTime: all
    test:
      targets: [MoonTimeUITests]
